<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Обжиг — анонс курса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;0,300;0,400;0,500;1,300&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="social.css">
<style>
.post { background: var(--glaze); color: var(--chamotte); }
.rings { position: absolute; right: -360px; bottom: -300px; width: 1100px; height: 1100px; }
.rings circle { fill: none; stroke: var(--chamotte); stroke-width: 1.5; opacity: .32; }
.rings .pin { fill: var(--heat); stroke: none; opacity: 1; }
.title { position: absolute; left: 80px; top: 250px; font-size: 136px; }
.title em { font-style: italic; font-weight: 300; color: var(--sand); }
.facts { position: absolute; left: 80px; bottom: 210px; display: flex; gap: 72px; }
.facts .v { font-size: 88px; }
.facts .k { font-size: 22px; margin-top: 18px; color: var(--sand); }
</style>
</head>
<body>
<div class="post speckle-dark">
  <svg class="rings" viewBox="0 0 1100 1100">
    <circle cx="550" cy="550" r="72"/><circle cx="550" cy="550" r="124"/><circle cx="550" cy="550" r="176"/><circle cx="550" cy="550" r="228"/><circle cx="550" cy="550" r="280"/><circle cx="550" cy="550" r="332"/><circle cx="550" cy="550" r="384"/><circle cx="550" cy="550" r="436"/><circle cx="550" cy="550" r="488"/><circle cx="550" cy="550" r="540"/>
    <circle class="pin" cx="550" cy="550" r="11"/>
  </svg>
  <div class="head">
    <img src="../../logo/logo-inverse.svg" alt="Обжиг">
    <div class="tag label muted">Набор · ноябрь</div>
  </div>
  <div class="title h1">Гончарный<br>круг.<br><em>Курс для взрослых</em></div>
  <div class="facts">
    <div><div class="v num">12.11</div><div class="k label">старт</div></div>
    <div><div class="v num">8 × 3 ч</div><div class="k label">занятий</div></div>
    <div><div class="v num">6</div><div class="k label">мест</div></div>
  </div>
  <div class="foot">
    <div class="label muted">Бауманская, 11, стр. 8</div>
    <div class="label muted">@obzhig_studio</div>
  </div>
</div>
</body>
</html>
