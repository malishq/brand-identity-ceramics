<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Обжиг — визитка 90×50</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;0,300;0,400;0,500;1,300&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<style>
@page { size: 90mm 50mm; margin: 0; }
body { background: #8a8a8a; }
.page { width: 1063px; height: 591px; overflow: hidden; position: relative; margin: 0 0 24px 0; }
.sheet { width: 1063px; height: 591px; position: relative; overflow: hidden; }
.front { background: var(--glaze); color: var(--chamotte); }
.front .logo { position: absolute; left: 50%; top: 50%; width: 540px; transform: translate(-50%, -56%); }
.front .foot { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font-size: 25px; color: var(--chamotte); opacity: .72; }
.back { background: var(--chamotte); color: var(--soot); }
.back .name { position: absolute; left: 72px; top: 72px; font-family: var(--serif); font-weight: 400; font-size: 50px; line-height: 1; letter-spacing: -0.01em; }
.back .role { position: absolute; left: 72px; top: 136px; font-size: 27px; line-height: 1.3; color: var(--soot); opacity: .72; max-width: 420px; }
.back .contacts { position: absolute; right: 72px; top: 76px; text-align: right; font-size: 27px; line-height: 1.6; font-variant-numeric: tabular-nums; }
.back .contacts b { font-weight: 500; }
.back .curve { position: absolute; left: 72px; right: 72px; bottom: 168px; height: 128px; }
.back .curve svg { width: 100%; height: 100%; overflow: visible; }
.back .addr { position: absolute; left: 72px; bottom: 64px; font-size: 25px; line-height: 1.3; opacity: .72; }
.back .hours { position: absolute; right: 72px; bottom: 64px; font-size: 25px; line-height: 1.3; opacity: .72; text-align: right; font-variant-numeric: tabular-nums; }
.back .tag { position: absolute; left: calc(72px + 30.9% + 18px); bottom: 300px; font-size: 21px; letter-spacing: .1em; opacity: .8; white-space: nowrap; }
@media print {
  body { background: none; }
  .page { width: 90mm; height: 50mm; margin: 0; page-break-after: always; break-after: page; }
  .page:last-child { page-break-after: auto; break-after: auto; }
  .page.p-front { background: var(--glaze); }
  .page.p-back { background: var(--chamotte); }
  .sheet { transform: scale(0.32, 0.3198); transform-origin: 0 0; }
}
</style>
</head>
<body>
<div class="page p-front">
  <section class="sheet front speckle-dark" id="front">
    <img class="logo" src="../../logo/logo-inverse.svg" alt="Обжиг">
    <div class="foot label">Студия керамики · Москва</div>
  </section>
</div>
<div class="page p-back">
  <section class="sheet back speckle-light" id="back">
    <div class="name">Мария Огнева</div>
    <div class="role">мастер, ведёт курс<br>гончарного круга</div>
    <div class="contacts">
      <div><b>+7 495 128-30-12</b></div>
      <div>hello@obzhig.studio</div>
      <div>@obzhig_studio</div>
      <div>obzhig.studio</div>
    </div>
    <div class="tag label">1222° · Δ6</div>
    <div class="curve">
      <svg viewBox="0 0 1000 400" preserveAspectRatio="none" fill="none">
        <path d="M0.0,400.0 L55.6,340.1 L69.4,340.1 L166.7,207.0 L277.8,40.6 L305.6,0.0 L312.5,0.0 C316.0,4.0 320.6,8.9 333.3,24.0 C346.1,39.0 361.1,61.1 388.9,90.5 C416.7,119.9 453.7,165.9 500.0,200.3 C546.3,234.7 611.1,270.8 666.7,296.8 C722.2,322.9 777.8,340.7 833.3,356.7 C888.9,372.8 972.2,387.2 1000.0,393.3" stroke="#1E4D41" stroke-width="2" vector-effect="non-scaling-stroke"/>
      </svg>
      <svg style="position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible" viewBox="0 0 1000 400" preserveAspectRatio="none">
        <circle cx="309" cy="0" r="6" fill="#E4572E" vector-effect="non-scaling-stroke" transform="scale(1,1)"/>
      </svg>
    </div>
    <div class="addr">Москва, Бауманская, 11, стр. 8<br>вход со двора, 2 этаж</div>
    <div class="hours">пн–пт 11:00–21:00<br>сб–вс 12:00–20:00</div>
  </section>
</div>
</body>
</html>
